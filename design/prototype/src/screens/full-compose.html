<template data-screen="full-compose"><header class="nav" data-ui="full-compose.nav"><a data-go="record">随哼</a><a data-go="library">我的作品</a></header><h1 data-ui="full-compose.title" data-bind="draft.title">创作完整版</h1><div class="skeleton" data-ui="full-compose.skeleton" data-when="drafting"></div><button data-when="idle" data-go="full-compose:draft-ready">AI 生成歌词</button><textarea rows="14" data-ui="full-compose.lyrics" data-bind="draft.lyrics" data-when="draft-ready submitting"></textarea><button data-ui="full-compose.submit" data-go="generating:queued">生成完整版</button><p data-when="error-quota">今天的完整版生成次数已用完</p><p data-when="error-network">网络连接失败，请重试</p></template>
